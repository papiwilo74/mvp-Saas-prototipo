name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastfood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastfood_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastfood_test?schema=public

      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastfood_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fastfood_test?schema=public
          JWT_SECRET: test-secret-that-is-long-enough-for-ci-123456
          FRONTEND_URL: http://localhost:5173
          NODE_ENV: test
          LOGIN_RATE_LIMIT_MAX: 50
          PUBLIC_RATE_LIMIT_MAX: 200

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test
        env:
          VITE_API_URL: http://localhost:4000/api
          VITE_RESTAURANT_SLUG: demo-burger
