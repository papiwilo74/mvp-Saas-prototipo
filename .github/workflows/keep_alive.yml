name: Keep-Alive & Cold-Start Warmer

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier spin-down (15m limit) and warm Neon DB
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'URL alternativa a verificar'
        required: false
        default: ''

jobs:
  ping:
    name: Ping Health & Warmup DB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Resilient Keep-Alive Ping
        working-directory: backend
        run: |
          if [ -n "${{ github.event.inputs.custom_url }}" ]; then
            node scripts/keep-alive.js --url="${{ github.event.inputs.custom_url }}"
          else
            node scripts/keep-alive.js
          fi
